name: Update Data

on:
  schedule:
    - cron: '45 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Run script
        run: python fetch.py

      - name: Commit file
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@mail.com"
          git add data.json
          git commit -m "update data" || echo "no changes"
          git push
